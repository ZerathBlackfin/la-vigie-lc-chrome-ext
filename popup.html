<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 500px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0B1C2D;
      color: #CFCBC3;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .content-wrapper {
      width: 100%;
      height: 100%;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      border: 3px solid #C49A6C;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      font-size: 14px;
      color: #C49A6C;
      font-weight: 600;
    }
    .settings-link {
      font-size: 11px;
      color: #9A968E;
      text-decoration: none;
      cursor: pointer;
    }
    .settings-link:hover {
      color: #D7B07E;
    }
    .info {
      background: #152F46;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      border: 1px solid #152F46;
    }
    .info-line {
      margin: 8px 0;
      word-break: break-word;
    }
    .info-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .info-col {
      flex: 1;
      min-width: 0;
    }
    .info-col-small {
      width: 120px;
      flex-shrink: 0;
    }
    .info-label {
      font-weight: 600;
      color: #9A968E;
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .info input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #152F46;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0B1C2D;
      color: #CFCBC3;
    }
    .info input:focus {
      outline: none;
      border-color: #C49A6C;
    }
    .info input[readonly] {
      background-color: #152F46;
      color: #9A968E;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      background: #C49A6C;
      color: white;
      margin-bottom: 12px;
    }
    button:hover {
      background: #D7B07E;
    }
    button:disabled {
      background: #152F46;
      cursor: not-allowed;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #9A968E;
      font-size: 13px;
      display: none;
    }
    .results {
      display: none;
      overflow-y: auto;
      flex: 1;
      margin-top: 12px;
    }
    .tracker-section {
      margin-bottom: 15px;
      border: 1px solid #152F46;
      border-radius: 6px;
      overflow: hidden;
      background: #152F46;
    }
    .tracker-header {
      background: #203549;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      color: #C49A6C;
      display: flex;
      justify-content: space-between;
    }
    .tracker-error {
      background: #123C3A;
      padding: 8px 10px;
      color: #B5655E;
      font-size: 11px;
    }
    .torrent-item {
      padding: 10px;
      border-top: 1px solid #152F46;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .torrent-item:hover {
      background: #152F46;
    }
    .torrent-info {
      flex: 1;
      min-width: 0;
    }
    .torrent-title {
      font-weight: 500;
      margin-bottom: 4px;
      color: #CFCBC3;
      word-break: break-word;
    }
    .torrent-btn {
      padding: 6px 10px;
      background: #c49a6c;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
      line-height: 1;
    }
    .torrent-btn:hover {
      background: #D7B07E;
    }
    .torrent-meta {
      color: #9A968E;
      font-size: 10px;
    }
    .no-results {
      padding: 20px;
      text-align: center;
      color: #D7B07E;
      font-size: 13px;
      font-weight: 500;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }
    .status.error {
      background: #123C3A;
      color: #B5655E;
      border: 1px solid #152F46;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <div class="header">
    <h3><img src="icons/icon.svg" width="14" height="14" style="vertical-align: middle; margin-right: 4px;"> La Vigie</h3>
    <a class="settings-link" id="settingsLink">Config</a>
  </div>
  
  <div class="info" id="pageInfo" style="display: none;">
    <div class="info-row">
      <div class="info-col">
        <label class="info-label">Titre:</label>
        <input type="text" id="infoTitle" placeholder="Titre du torrent">
      </div>
      <div class="info-col-small">
        <label class="info-label">Taille (Go):</label>
        <input type="text" id="infoSize" placeholder="Ex: 49.78" readonly>
      </div>
    </div>
  </div>
  
  <button id="checkBtn">Vérifier les doublons</button>
  
  <div class="status" id="status"></div>
  
  <div class="loading" id="loading">Recherche en cours...</div>
  
  <div class="results" id="results"></div>
  </div>
  
  <script src="trackers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
